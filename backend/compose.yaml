services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an approved digest-pinned PostgreSQL image}
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  synapse-generate:
    image: ${SYNAPSE_IMAGE:?Set SYNAPSE_IMAGE to an approved digest-pinned Synapse image}
    profiles: ["init"]
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME:?Set MATRIX_SERVER_NAME in .env}
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - synapse_data:/data
    command: generate
    networks:
      - private

  synapse:
    image: ${SYNAPSE_IMAGE:?Set SYNAPSE_IMAGE to an approved digest-pinned Synapse image}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME:?Set MATRIX_SERVER_NAME in .env}
      SYNAPSE_REPORT_STATS: "no"
      NYMPH_PARTNER_A_USER_ID: ${NYMPH_PARTNER_A_USER_ID:?Set NYMPH_PARTNER_A_USER_ID in .env}
      NYMPH_PARTNER_B_USER_ID: ${NYMPH_PARTNER_B_USER_ID:?Set NYMPH_PARTNER_B_USER_ID in .env}
      NYMPH_APP_ORIGINS: ${NYMPH_APP_ORIGINS:?Set NYMPH_APP_ORIGINS in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REGISTRATION_SHARED_SECRET_FILE: /run/secrets/registration_shared_secret
      PYTHONPATH: /modules
    secrets:
      - postgres_password
      - registration_shared_secret
    volumes:
      - synapse_data:/data
      - ./configure_synapse.py:/opt/nymph/configure_synapse.py:ro
      - ./dev-modules:/modules:ro
      - ./nymph_safe_logging.py:/modules/nymph_safe_logging.py:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: ["python /opt/nymph/configure_synapse.py && exec /start.py run"]
    expose:
      - "8008"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/_synapse/client/nymph/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to an approved digest-pinned Caddy image}
    restart: unless-stopped
    depends_on:
      - synapse
    environment:
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?Set MATRIX_SERVER_NAME in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  private:

volumes:
  postgres_data:
  synapse_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  registration_shared_secret:
    file: ./secrets/registration_shared_secret
